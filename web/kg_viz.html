<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KG Viz — Nanite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel2: #202533;
  --text: #f6f7fb; --muted: #9aa3b2; --accent: #f5c26b; --accent2: #6bd1f5;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;height:100vh}
.app{display:grid;grid-template-columns:310px 1fr 300px;height:100vh;gap:0}

.sidebar{background:var(--panel);border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;padding:16px;gap:8px;overflow-y:auto}
.sidebar h2{font-size:15px;margin:0;color:var(--accent);letter-spacing:0.04em}
.db-select select{width:100%;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:var(--panel2);color:var(--text);font-size:13px;font-family:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{padding:8px;border-radius:8px;background:var(--panel2);text-align:center}
.stat .val{font-size:16px;font-weight:600;font-family:"IBM Plex Mono",monospace}
.stat .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px}
.stat.good .val{color:#34d399}.stat.warn .val{color:var(--accent)}.stat.bad .val{color:#f87171}
.search input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:var(--panel2);color:var(--text);font-size:13px;font-family:inherit}
.search input::placeholder{color:var(--muted)}
.type-filters{display:flex;flex-wrap:wrap;gap:4px}
.type-chip{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid;cursor:pointer;opacity:0.45;transition:opacity 0.15s;user-select:none}
.type-chip.on{opacity:1}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sec-header h3{font-size:12px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em}
.sec-header .sec-actions{display:flex;gap:6px}
.sec-btn{font-size:9px;padding:2px 8px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:var(--panel2);color:var(--muted);cursor:pointer}
.sec-btn:hover{color:var(--text);border-color:var(--accent2)}
.sec-btn.on{color:var(--accent2);border-color:var(--accent2)}
.sec-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1px}
.sec-item{display:flex;align-items:flex-start;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;font-size:11px;border:1px solid transparent;margin-bottom:1px;color:var(--muted)}
.sec-item:hover{background:var(--panel2)}
.sec-item input{cursor:pointer;flex-shrink:0;accent-color:var(--accent2)}
.sec-item label{cursor:pointer;line-height:1.3;word-break:break-all;flex:1;font-size:10px}
.sec-item:has(input:checked) label,.sec-item:has(input:checked){color:var(--text)}
.sec-count{font-size:9px;font-family:"IBM Plex Mono",monospace;flex-shrink:0;min-width:24px;text-align:right}

.canvas-wrap{position:relative}
#cy{width:100%;height:100%}
.legend{position:absolute;bottom:16px;left:16px;display:flex;flex-wrap:wrap;gap:8px;background:rgba(23,26,33,0.92);padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.08)}
.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.legend-item{font-size:10px;color:var(--muted)}
.canvas-legend{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:4px;background:rgba(23,26,33,0.92);padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);font-size:10px;color:var(--muted)}
.canvas-legend .el{display:flex;align-items:center;gap:6px}
.canvas-legend .eline{width:24px;height:2px}

.detail{background:var(--panel);border-left:1px solid rgba(255,255,255,0.08);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.detail h3{font-size:16px;margin:0;word-break:break-all}
.detail .meta{font-size:11px;color:var(--muted)}
.detail .tags{display:flex;flex-wrap:wrap;gap:4px}
.detail .tag{font-size:10px;padding:2px 8px;border-radius:12px;background:var(--panel2)}
.detail .section h4{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 4px}
.detail .section .list{font-size:12px;color:var(--muted);line-height:1.6}
.detail .empty{font-size:13px;color:var(--muted);text-align:center;margin-top:60px}

.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
.loading .spinner{width:40px;height:40px;border:3px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h2>KG Viz</h2>
    <div class="db-select"><select id="dbSelect"><option value="">Loading...</option></select></div>
    <div class="stats">
      <div class="stat"><div class="val" id="stEnt">-</div><div class="lbl">Entities</div></div>
      <div class="stat"><div class="val" id="stRel">-</div><div class="lbl">Edges</div></div>
      <div class="stat warn"><div class="val" id="stComp">-</div><div class="lbl">Components</div></div>
      <div class="stat bad"><div class="val" id="stIso">-</div><div class="lbl">Isolated</div></div>
    </div>
    <div class="search"><input id="searchInput" placeholder="Search entity name..."/></div>
    <div class="type-filters" id="typeFilters"></div>
    <div class="sec-header"><h3>SECTIONS</h3>
      <div class="sec-actions">
        <span class="sec-btn on" id="secAllBtn" onclick="toggleAllSections()">All</span>
        <span class="sec-btn" id="secNoneBtn" onclick="clearAllSections()">None</span>
      </div>
    </div>
    <div class="sec-list" id="secList"></div>
  </div>
  <div class="canvas-wrap">
    <div class="loading" id="loading"><div class="spinner"></div></div>
    <div id="cy"></div>
    <div class="legend" id="legend"></div>
    <div class="canvas-legend">
      <div class="el"><span class="eline solid" style="background:#f87171;height:2px"></span> Connection</div>
      <div class="el"><span class="eline solid" style="background:#fb923c;height:2px"></span> Interface</div>
      <div class="el"><span class="eline solid" style="background:#818cf8;height:2px"></span> Allocation</div>
    </div>
  </div>
  <div class="detail" id="detailPane"><div class="empty">Click a node or edge to see details</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const AUTO_DB = "AUTO_DB_NAME";
let currentData = null, cy = null, activeTypes = new Set(), activeSections = new Set();

const TYPE_COLORS = {
  PartDef:"#6bd1f5",AttributeDef:"#a78bfa",PortDef:"#f5c26b",
  ItemDef:"#34d399",ConnectionDef:"#f87171",InterfaceDef:"#fb923c",
  AllocationDef:"#818cf8",CommandDef:"#f472b6",RequirementDef:"#94a3b8",
  PartUsage:"#6bd1f5",PortUsage:"#f5c26b",AttributeUsage:"#a78bfa",
  ConnectionUsage:"#f87171",InterfaceUsage:"#fb923c",AllocationUsage:"#818cf8",
  ContainmentUsage:"#34d399",CompositionUsage:"#f59e0b",ReferenceUsage:"#94a3b8"
};
// Directional types: Allocation,Interface,Containment,Composition get arrows; Connection,Reference no arrows
const DIRECTIONAL = new Set(["AllocationUsage","AllocationDef","InterfaceUsage","InterfaceDef","ContainmentUsage","CompositionUsage"]);

async function loadDatabases() {
  try {
    const r = await fetch("/api/rag/dbs"); const dbs = await r.json();
    const sel = document.getElementById("dbSelect"); sel.innerHTML = "";
    let found = false;
    (dbs.databases||dbs.db_names||dbs||[]).forEach(db => {
      const opt = document.createElement("option"); opt.value = db; opt.textContent = db;
      sel.appendChild(opt); if (db === AUTO_DB) { sel.value = db; found = true; }
    });
    if (!found && sel.options.length > 0) sel.value = sel.options[0].value;
    if (sel.value) loadGraph(sel.value);
  } catch(e) { console.error(e); }
}
document.getElementById("dbSelect").onchange = e => loadGraph(e.target.value);

async function loadGraph(dbName) {
  if (!dbName) return;
  document.getElementById("loading").style.display = "flex";
  document.getElementById("detailPane").innerHTML = '<div class="empty">Click a node or edge to see details</div>';
  try {
    const r = await fetch(`/api/rag/dbs/${encodeURIComponent(dbName)}/kg/graph`);
    currentData = await r.json();
    buildSectionList(); renderGraph();
  } catch(e) { console.error(e); alert("Failed to load: " + e.message); }
  document.getElementById("loading").style.display = "none";
}

function buildSectionList() {
  const d = currentData; if (!d || !d.sections) return;
  const secEl = document.getElementById("secList"); secEl.innerHTML = "";
  const snc={}, sec={}; d.sections.forEach(s=>{snc[s]=0;sec[s]=0;});
  d.nodes.forEach(n=>{(n.sections||[]).forEach(s=>{if(snc.hasOwnProperty(s))snc[s]++;})});
  d.edges.forEach(e=>{(e.sections||[]).forEach(s=>{if(snc.hasOwnProperty(s))sec[s]++;})});
  activeSections = new Set(d.sections);
  document.getElementById("secAllBtn").classList.add("on");
  document.getElementById("secNoneBtn").classList.remove("on");
  d.sections.forEach(s => {
    const div = document.createElement("div"); div.className = "sec-item";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = true;
    cb.onchange = () => { if (cb.checked) activeSections.add(s); else activeSections.delete(s); updateSecButtons(); applySectionOpacity(); };
    const label = document.createElement("label"); label.textContent = s; label.title = s;
    const count = document.createElement("span"); count.className = "sec-count"; count.textContent = (snc[s]||0)+(sec[s]||0);
    div.appendChild(cb); div.appendChild(label); div.appendChild(count); secEl.appendChild(div);
  });
}
function toggleAllSections() {
  const d = currentData; if (!d || !d.sections) return;
  const allOn = activeSections.size === d.sections.length;
  const cbs = document.querySelectorAll("#secList input");
  if (allOn) { cbs.forEach(cb => cb.checked = false); activeSections = new Set(); }
  else { cbs.forEach(cb => cb.checked = true); activeSections = new Set(d.sections); }
  updateSecButtons(); applySectionOpacity();
}
function clearAllSections() {
  document.querySelectorAll("#secList input").forEach(cb => cb.checked = false);
  activeSections = new Set(); updateSecButtons(); applySectionOpacity();
}
function updateSecButtons() {
  const d = currentData;
  document.getElementById("secAllBtn").classList.toggle("on", d && d.sections && activeSections.size === d.sections.length);
  document.getElementById("secNoneBtn").classList.toggle("on", activeSections.size === 0);
}

function renderGraph() {
  const d = currentData; if (!d) return;
  document.getElementById("stEnt").textContent = d.total_entities;
  document.getElementById("stRel").textContent = d.total_edges;
  document.getElementById("stComp").textContent = d.connected_components;
  document.getElementById("stIso").textContent = d.isolated_count;
  const typeSet = new Set(d.nodes.map(n=>n.type));
  const filterEl = document.getElementById("typeFilters"); filterEl.innerHTML = "";
  activeTypes = new Set(typeSet);
  [...typeSet].sort().forEach(t => {
    const chip = document.createElement("span"); chip.className = "type-chip on";
    chip.style.borderColor = TYPE_COLORS[t]||"#666"; chip.style.color = TYPE_COLORS[t]||"#666"; chip.textContent = t;
    chip.onclick = () => { if (activeTypes.has(t)) { activeTypes.delete(t); chip.classList.remove("on"); } else { activeTypes.add(t); chip.classList.add("on"); } applyAllFilters(); };
    filterEl.appendChild(chip);
  });
  const legendEl = document.getElementById("legend");
  legendEl.innerHTML = [...typeSet].sort().map(t => `<span class="legend-item"><span class="dot" style="background:${TYPE_COLORS[t]||"#666"}"></span>${t}</span>`).join("");
  buildCytoscape(d.nodes, d.edges);
}

function buildCytoscape(nodes, edges) {
  if (cy) cy.destroy();
  const typeFiltered = new Set(nodes.filter(n=>activeTypes.has(n.type)).map(n=>n.id));
  const cyNodes = nodes.filter(n=>typeFiltered.has(n.id)).map(n => ({ data: { id:n.id,label:n.id,type:n.type,cntype:n.cntype,color:n.color,aliases:n.aliases||[],sections:n.sections||[],description:n.description||"",qname:n.qname }}));
  const cyEdges = edges.filter(e=>typeFiltered.has(e.source)&&typeFiltered.has(e.target)).map(e => ({
    data: { id:`${e.source}→${e.target}`, source:e.source, target:e.target, label:e.label, type:e.type, cntype:e.cntype, directional:DIRECTIONAL.has(e.type), sections:e.sections||[], description:e.description||"" }
  }));

  const container = document.getElementById("cy");
  cy = cytoscape({ container, elements:{nodes:cyNodes,edges:cyEdges},
    style: [
      {selector:"node",style:{"background-color":"data(color)","label":"data(label)","color":"#f6f7fb","font-size":"10px","font-family":"IBM Plex Mono","text-valign":"center","text-halign":"center","text-wrap":"wrap","text-max-width":"100px","width":24,"height":24,"border-width":2,"border-color":"rgba(255,255,255,0.13)","opacity":0.85,"text-outline-width":2,"text-outline-color":"#0f1115"}},
      {selector:"node:selected",style:{"border-color":"data(color)","border-width":3,"opacity":1}},
      {selector:"edge",style:{"width":1.5,"line-color":"#4a5568","target-arrow-shape":"none","curve-style":"unbundled-bezier","opacity":0.4,"label":"data(label)","font-size":"7px","color":"#4a5568","text-opacity":0.6}},
      {selector:"edge[directional]",style:{"target-arrow-shape":"triangle","target-arrow-color":"#4a5568","arrow-scale":0.8}},
      {selector:"edge[type='ConnectionUsage'],edge[type='ConnectionDef']",style:{"line-color":"#f87171"}},
      {selector:"edge[type='InterfaceUsage'],edge[type='InterfaceDef']",style:{"line-color":"#fb923c"}},
      {selector:"edge[type='AllocationUsage'],edge[type='AllocationDef']",style:{"line-color":"#818cf8"}},
      {selector:"edge[type='ContainmentUsage'],edge[type='ContainmentDef']",style:{"line-color":"#34d399"}},
      {selector:"edge[type='CompositionUsage'],edge[type='CompositionDef']",style:{"line-color":"#f59e0b"}},
      {selector:"edge[type='ReferenceUsage'],edge[type='ReferenceDef']",style:{"line-color":"#94a3b8"}},
      {selector:"edge[directional][type='InterfaceUsage'],edge[directional][type='InterfaceDef']",style:{"target-arrow-color":"#fb923c"}},
      {selector:"edge[directional][type='AllocationUsage'],edge[directional][type='AllocationDef']",style:{"target-arrow-color":"#818cf8"}},
      {selector:"edge[directional][type='ContainmentUsage'],edge[directional][type='ContainmentDef']",style:{"target-arrow-color":"#34d399"}},
      {selector:"edge[directional][type='CompositionUsage'],edge[directional][type='CompositionDef']",style:{"target-arrow-color":"#f59e0b"}},
      {selector:"edge.hover",style:{"opacity":0.8,"width":2.5}}
    ],
    layout:{name:"random"},
    minZoom:0.02, maxZoom:3
  });
  cy.on("layoutstop", () => { runForceLayout(cy); applySectionOpacity(); });
  cy.on("tap", "node", evt => showNodeDetail(evt.target.data()));
  cy.on("tap", "edge", evt => showEdgeDetail(evt.target.data()));
  cy.on("tap", evt => { if (evt.target === cy) { document.getElementById("detailPane").innerHTML = '<div class="empty">Click a node or edge to see details</div>'; }});
}

// ── Deterministic Spectral Layout ──
// Per-component spectral embedding with direct scaling (no min-max stretch).
function runForceLayout(cy) {
  const nodes = cy.nodes(); const n = nodes.length; if (n < 2) return;
  const W = cy.width() || 1200, H = cy.height() || 900;

  // Build edge list with global node indices
  const edgeList = cy.edges().map(e => ({
    s: nodes.indexOf(e.source()), t: nodes.indexOf(e.target())
  })).filter(e => e.s >= 0 && e.t >= 0);

  // ── Step 1: Find connected components (BFS) ──
  const visited = new Array(n).fill(false);
  const comps = [];
  for (let i = 0; i < n; i++) {
    if (visited[i]) continue;
    const comp = []; const q = [i]; visited[i] = true;
    while (q.length) {
      const u = q.shift(); comp.push(u);
      for (const e of edgeList) {
        const v = e.s === u ? e.t : e.t === u ? e.s : -1;
        if (v >= 0 && !visited[v]) { visited[v] = true; q.push(v); }
      }
    }
    comps.push(comp);
  }

  // ── Step 2: spectralXY per component (preserves eigenvector spacing) ──
  function spectralXY_component(nodeIDs, edgeList, compW, compH) {
    const k = nodeIDs.length;
    if (k === 1) return [{ x: compW / 2, y: compH / 2 }];
    if (k === 2) {
      const r = Math.min(compW, compH) * 0.3;
      return [{ x: compW / 2 - r, y: compH / 2 }, { x: compW / 2 + r, y: compH / 2 }];
    }

    // Map global indices → local [0..k-1]
    const localIdx = {};
    for (let i = 0; i < k; i++) localIdx[nodeIDs[i]] = i;

    // Build local degree array and edges
    const deg = new Array(k).fill(0);
    const localEdges = [];
    for (const e of edgeList) {
      const li = localIdx[e.s], lj = localIdx[e.t];
      if (li !== undefined && lj !== undefined) {
        deg[li]++; deg[lj]++;
        localEdges.push({ s: li, t: lj });
      }
    }

    // Symmetric normalized Laplacian multiply (L_sym * vec)
    const sd = i => Math.sqrt(Math.max(deg[i], 1e-6));
    function LsymMultiply(vec) {
      const out = new Array(k).fill(0);
      for (const e of localEdges) {
        const w = 1.0 / Math.max(sd(e.s) * sd(e.t), 1e-10);
        out[e.s] += vec[e.s] / Math.max(deg[e.s], 1) - vec[e.t] * w;
        out[e.t] += vec[e.t] / Math.max(deg[e.t], 1) - vec[e.s] * w;
      }
      for (let i = 0; i < k; i++) {
        if (deg[i] === 0) out[i] = vec[i];
      }
      return out;
    }

    // Power iteration for eigenvector, orthogonal to given list
    function powerIter(orthoVecs, maxIter) {
      let v = [];
      for (let i = 0; i < k; i++) v.push(i % 2 === 0 ? 1 : -1);
      for (const ov of orthoVecs) {
        let dot = 0;
        for (let i = 0; i < k; i++) dot += v[i] * ov[i];
        for (let i = 0; i < k; i++) v[i] -= dot * ov[i];
      }
      if (orthoVecs.length === 0) {
        let mean = 0;
        for (let i = 0; i < k; i++) mean += v[i];
        mean /= k;
        for (let i = 0; i < k; i++) v[i] -= mean;
      }
      for (let iter = 0; iter < maxIter; iter++) {
        const Lv = LsymMultiply(v);
        const next = v.map((vi, i) => vi - Lv[i] / 2);
        for (const ov of orthoVecs) {
          let dot = 0;
          for (let i = 0; i < k; i++) dot += next[i] * ov[i];
          for (let i = 0; i < k; i++) next[i] -= dot * ov[i];
        }
        {
          let mean = 0;
          for (let i = 0; i < k; i++) mean += next[i];
          mean /= k;
          for (let i = 0; i < k; i++) next[i] -= mean;
        }
        let norm = 0;
        for (let i = 0; i < k; i++) norm += next[i] * next[i];
        norm = Math.sqrt(norm);
        if (norm < 1e-10) break;
        for (let i = 0; i < k; i++) v[i] = next[i] / norm;
      }
      return v;
    }

    // 2nd and 3rd eigenvectors (Fiedler + next)
    const v2 = powerIter([], 200);
    const v3 = powerIter([v2], 200);

    // Direct scaling — preserves eigenvector spacing (NO min-max stretch)
    const scale = Math.min(compW, compH) / Math.sqrt(k) * 0.8;
    const cx = compW / 2, cy = compH / 2;
    const xy = [];
    for (let i = 0; i < k; i++) {
      xy.push({ x: cx + v2[i] * scale, y: cy + v3[i] * scale });
    }
    return xy;
  }

  // ── Step 3: Arrange components on canvas (strip-packing) ──
  comps.sort((a, b) => b.length - a.length);
  const compXY = [];
  let offsetX = 0, offsetY = 0, rowH = 0;
  const totalN = comps.reduce((a, c) => a + c.length, 0);
  for (const comp of comps) {
    const frac = comp.length / totalN;
    const compW = Math.sqrt(frac) * W * 1.5;
    const compH = Math.sqrt(frac) * H * 1.5;
    const xy = spectralXY_component(comp, edgeList, compW, compH);
    for (let i = 0; i < comp.length; i++) {
      xy[i].x += offsetX;
      xy[i].y += offsetY;
    }
    compXY.push({ comp, xy });
    offsetX += compW;
    if (offsetX > W * 1.2) { offsetX = 0; offsetY += rowH; rowH = 0; }
    rowH = Math.max(rowH, compH);
  }

  // ── Step 4: Apply to Cytoscape ──
  const finalXY = new Array(n);
  for (const { comp, xy } of compXY) {
    for (let i = 0; i < comp.length; i++) {
      finalXY[comp[i]] = xy[i];
    }
  }
  nodes.forEach((node, i) => { node.position({ x: finalXY[i].x, y: finalXY[i].y }); });

  // Visual depth by component index (larger components = larger nodes)
  nodes.forEach((node, i) => {
    let compIdx = -1;
    for (let ci = 0; ci < comps.length; ci++) {
      if (comps[ci].includes(i)) { compIdx = ci; break; }
    }
    const depth = compIdx >= 0 ? compIdx / Math.max(comps.length, 1) : 0.5;
    node.style("width", 18 + depth * 10);
    node.style("height", 18 + depth * 10);
  });

  cy.fit(undefined, 50);
}

// ── Section opacity ──
function applySectionOpacity() {
  if (!cy || !currentData) return;
  const allSections = currentData.sections || [];
  const allSelected = activeSections.size === 0 || activeSections.size === allSections.length;
  cy.nodes().forEach(n => {
    const ns = n.data("sections")||[];
    const visible = allSelected || ns.some(s => activeSections.has(s));
    n.style("opacity", visible ? 0.85 : 0.5);
  });
  cy.edges().forEach(e => {
    const es = e.data("sections")||[];
    const visible = allSelected || es.some(s => activeSections.has(s));
    e.style("opacity", visible ? 0.4 : 0.15);
  });
}

// ── Detail panels ──
function showNodeDetail(nd) {
  if (!nd) { document.getElementById("detailPane").innerHTML = '<div class="empty">Click a node or edge to see details</div>'; return; }
  const aliases = (nd.aliases||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join("")||'<span class="tag">none</span>';
  const secs = (nd.sections||[]).slice(0,12).map(s=>`<li>${esc(s)}</li>`).join("")||'<li>unknown</li>';
  document.getElementById("detailPane").innerHTML = `
    <h3>${esc(nd.id)}</h3>
    <div class="meta"><span style="color:${nd.color}">${nd.cntype}</span> <span>${nd.type}</span></div>
    ${nd.description?`<div style="font-size:12px;color:var(--muted);line-height:1.5">${esc(nd.description)}</div>`:""}
    <div class="section"><h4>Aliases</h4><div class="tags">${aliases}</div></div>
    <div class="section"><h4>Source Sections (${(nd.sections||[]).length})</h4><div class="list"><ul style="margin:0;padding-left:16px">${secs}</ul></div></div>
  `;
}
function showEdgeDetail(ed) {
  if (!ed) { document.getElementById("detailPane").innerHTML = '<div class="empty">Click a node or edge to see details</div>'; return; }
  const dir = ed.directional ? "→" : "—";
  const secs = (ed.sections||[]).slice(0,10).map(s=>`<li>${esc(s)}</li>`).join("")||'<li>unknown</li>';
  document.getElementById("detailPane").innerHTML = `
    <h3>${esc(ed.source)} ${dir} ${esc(ed.target)}</h3>
    <div class="meta"><span>${ed.cntype}</span> <span>${ed.type}</span></div>
    ${ed.description?`<div style="font-size:12px;color:var(--muted);line-height:1.5">${esc(ed.description)}</div>`:""}
    <div class="section"><h4>Source Sections (${(ed.sections||[]).length})</h4><div class="list"><ul style="margin:0;padding-left:16px">${secs}</ul></div></div>
  `;
}
function getDb(){return document.getElementById("dbSelect").value}
function esc(s){const el=document.createElement("div");el.textContent=s;return el.innerHTML}

function applyAllFilters() { if (!currentData) return; buildCytoscape(currentData.nodes, currentData.edges); }

document.getElementById("searchInput").oninput = function() {
  if (!cy) return;
  const q = this.value.toLowerCase().trim();
  const allSections = currentData.sections || [];
  const allSec = activeSections.size === 0 || activeSections.size === allSections.length;
  cy.nodes().forEach(n => {
    const match = !q || n.data("id").toLowerCase().includes(q);
    const ns = n.data("sections")||[];
    const secMatch = allSec || ns.some(s => activeSections.has(s));
    if (!match) { n.style("opacity", 0.08); n.style("width", 12); n.style("height", 12); }
    else if (!secMatch) { n.style("opacity", 0.5); n.style("width", 24); n.style("height", 24); }
    else { n.style("opacity", 0.85); n.style("width", 24); n.style("height", 24); }
  });
  cy.edges().forEach(e => {
    const s = parseFloat(e.source().style("opacity")) > 0.5;
    const t = parseFloat(e.target().style("opacity")) > 0.5;
    const es = e.data("sections")||[];
    const secMatch = allSec || es.some(s => activeSections.has(s));
    if (!(s&&t)) e.style("opacity", 0.04);
    else if (!secMatch) e.style("opacity", 0.15);
    else e.style("opacity", 0.4);
  });
};

loadDatabases();
</script>
